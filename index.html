<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Carnet de Recettes</title>
  <meta name="description" content="Centralisez et gérez toutes vos recettes de cuisine en un seul endroit." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f97316" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Recettes" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="icon" type="image/png" href="logo.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />

  <!-- Anti-flash thème : applique le thème avant le rendu -->
  <script>
    (function() {
      const t = localStorage.getItem('theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ====== HEADER / NAVIGATION ====== -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <img src="logo.png" alt="Logo" class="brand-icon" style="width:38px;height:38px;border-radius:10px;object-fit:cover;" />
        <span class="brand-name">Carnet de Recettes <span style="font-size:0.6rem; background:linear-gradient(135deg, var(--primary), var(--accent)); color:white; padding:3px 8px; border-radius:12px; margin-left:6px; vertical-align:middle; font-weight:800; letter-spacing:0.05em; box-shadow:0 2px 8px rgba(249,115,22,0.3);">V2.0 CLOUD</span></span>
      </div>
      <div style="display:flex; align-items:center; gap:20px;">
        <nav class="nav" id="main-nav">
          <button class="nav-btn active" data-tab="home" id="nav-home">
            <span class="nav-icon">📖</span> Mes Recettes
          </button>
          <button class="nav-btn" data-tab="add" id="nav-add">
            <span class="nav-icon">✏️</span> Ajouter
          </button>
          <button class="nav-btn" data-tab="import" id="nav-import">
            <span class="nav-icon">🔗</span> Importer
          </button>
          <button class="nav-btn" data-tab="sites" id="nav-sites">
            <span class="nav-icon">🌍</span> Sites
          </button>
          <button class="nav-btn nav-btn--settings" data-tab="settings" id="nav-settings" title="Paramètres">
            ⚙️
          </button>
          <button class="theme-toggle" id="theme-toggle-btn" title="Changer de thème" aria-label="Basculer thème clair/sombre">
            🌙
          </button>
        </nav>
        <div class="auth-section">
          <button class="btn btn--sm" id="nav-auth" style="background:var(--primary-glow);color:var(--primary);border:1px solid rgba(249,115,22,0.4);display:none;font-weight:800;">
            Se connecter
          </button>
          <div id="user-info" style="display:none;align-items:center;gap:10px;">
            <img id="user-avatar" src="" alt="" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--primary);object-fit:cover;box-shadow:0 2px 8px rgba(249,115,22,0.3);" />
            <button class="btn btn--sm btn--danger" id="nav-logout" style="padding:6px 12px;font-size:0.75rem;">Quitter</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ====== MAIN CONTENT ====== -->
  <main class="main">
    <div id="app">
      <!-- Contenu dynamique injecté par JavaScript -->
    </div>
  </main>

  <!-- ====== MODAL détail recette ====== -->
  <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
      <div class="modal-content" id="modal-content">
        <!-- Fiche détail injectée ici -->
      </div>
    </div>
  </div>

  <!-- ====== TOAST NOTIFICATIONS ====== -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- ====== BOTTOM NAV MOBILE ====== -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="bottom-nav-btn active" data-tab="home" id="bnav-home">
      <span class="bottom-nav-icon">📖</span>
      <span class="bottom-nav-label">Recettes</span>
    </button>
    <button class="bottom-nav-btn" data-tab="add" id="bnav-add">
      <span class="bottom-nav-icon">✏️</span>
      <span class="bottom-nav-label">Ajouter</span>
    </button>
    <button class="bottom-nav-btn" data-tab="import" id="bnav-import">
      <span class="bottom-nav-icon">🔗</span>
      <span class="bottom-nav-label">Importer</span>
    </button>
    <button class="bottom-nav-btn" data-tab="sites" id="bnav-sites">
      <span class="bottom-nav-icon">🌍</span>
      <span class="bottom-nav-label">Sites</span>
    </button>
    <button class="bottom-nav-btn" data-tab="settings" id="bnav-settings">
      <span class="bottom-nav-icon">⚙️</span>
      <span class="bottom-nav-label">Réglages</span>
    </button>
    <button class="bottom-nav-btn" id="bnav-theme" aria-label="Basculer thème" style="color:var(--text-dim);">
      <span class="bottom-nav-icon" id="bnav-theme-icon">🌙</span>
      <span class="bottom-nav-label">Thème</span>
    </button>
  </nav>

  <!-- ====== MODULES JS ====== -->
  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>

  <script src="js/data.js?v=19"></script>
  <script src="js/recipes.js?v=19"></script>
  <script src="js/nutrition.js?v=19"></script>
  <script src="js/form.js?v=19"></script>
  <script src="js/importer.js?v=19"></script>
  <script src="js/sites.js?v=19"></script>
  <script src="js/app.js?v=19"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          console.log('✅ Service Worker enregistré');
          // Vérifier les mises à jour à chaque chargement de page
          reg.update();
        })
        .catch(err => console.warn('⚠️ SW:', err));
    }
  </script>
</body>
</html>
